name: Deploy Quizmill Pack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout pack
        uses: actions/checkout@v6
        with:
          path: pack

      - name: Checkout quizmill engine
        uses: actions/checkout@v6
        with:
          repository: quizmill/quizmill
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install engine dependencies
        working-directory: engine
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm ci

      - name: Validate pack
        working-directory: engine
        run: npm run pack:validate ../pack

      - name: Activate pack
        working-directory: engine
        run: npm run pack:use ../pack

      - name: Build static app
        working-directory: engine
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create pack-aws-arch-pro --production-branch main || true
          npx wrangler pages deploy engine/out --project-name pack-aws-arch-pro
